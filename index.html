<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catch My Heart 💖</title>

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Comic Sans MS", "Arial Rounded MT Bold", Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      overflow: hidden;
      padding: 20px;
    }

    h1 {
      font-size: clamp(2.5rem, 6vw, 3.5rem);
      margin-bottom: 8px;
    }

    p {
      font-size: clamp(1.4rem, 4.5vw, 2rem);
      margin-bottom: 16px;
    }

    .note {
      font-size: clamp(1rem, 3.5vw, 1.3rem);
      color: #7a1f2b;
      margin-bottom: 6px;
      opacity: 0.9;
    }

    .buttons {
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 160px;
      margin-top: 20px;
    }

    button {
      padding: 16px 32px;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      border: none;
      border-radius: 40px;
      cursor: pointer;
      position: absolute;
      white-space: nowrap;
    }

    #yes {
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #ff4d6d;
      color: white;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      z-index: 2;
    }

    #no {
      right: 40px;
      top: 50%;
      transform: translateY(-50%);
      background-color: #e0e0e0;
      z-index: 1;
    }

    #customMessage {
      display: none;
      font-size: clamp(1.2rem, 4vw, 1.6rem);
      margin-bottom: 10px;
      color: #7a1f2b;
    }

    .footer-note {
      position: absolute;
      bottom: 20px;
      font-size: 0.95rem;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <h1 id="title">Hey ❤️</h1>

  <!-- Custom message from buyer (optional) -->
  <p id="customMessage"></p>

  <!-- Always visible main question -->
  <p id="message">Will you be my Valentine?</p>

  <div class="note">✨ No pressure… but also yes pressure ✨</div>
  <div class="note">💌 Carefully consider your answer</div>
  <div class="note">😏 One option is clearly superior</div>

  <div class="buttons" id="container">
    <button id="yes" onclick="yesClicked()">Yes 💕</button>
    <button id="no">No 🙃</button>
  </div>

  <div class="footer-note">
    Made with questionable ethics but good intentions 💖
  </div>

  <script>
    // ----------------------------
    // URL PARAMS (name + message)
    // ----------------------------
    const params = new URLSearchParams(window.location.search);

    const nameFromUrl = params.get("name");
    const messageFromUrl = params.get("msg");

    const titleEl = document.getElementById("title");
    const customMessageEl = document.getElementById("customMessage");

    if (nameFromUrl) {
      titleEl.textContent = `Hey ${nameFromUrl} ❤️`;
    }

    if (messageFromUrl) {
      customMessageEl.textContent = messageFromUrl;
      customMessageEl.style.display = "block";
    }

    // ----------------------------
    // NO BUTTON ESCAPE LOGIC
    // ----------------------------
    const noBtn = document.getElementById("no");
    const container = document.getElementById("container");

    function moveNo() {
      const padding = 10;
      const maxX = container.clientWidth - noBtn.offsetWidth - padding;
      const maxY = container.clientHeight - noBtn.offsetHeight - padding;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.right = "auto";
      noBtn.style.transform = "none";
    }

    noBtn.addEventListener("mousemove", moveNo);
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNo();
    });

    // ----------------------------
    // YES BUTTON
    // ----------------------------
    function yesClicked() {
      document.body.innerHTML = `
        <h1>YAY!!! 🥰</h1>
        <p>Best decision you’ve made all day 💖</p>
        <p class="note">💘 Valentine status: CONFIRMED 💘</p
