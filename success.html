<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Valentine Page 💖</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    .link-box {
      background: white;
      padding: 16px;
      border-radius: 10px;
      max-width: 600px;
      word-break: break-all;
      font-size: 1rem;
    }

    button {
      margin-top: 20px;
      padding: 12px 24px;
      font-size: 1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      background-color: #ff4d6d;
      color: white;
    }
  </style>
</head>
<body>

  <h1>🎉 Your Valentine Page Is Ready!</h1>
  <p>Copy this link and send it to your Valentine 💌</p>

  <div class="link-box" id="finalLink">Generating your link…</div>
  <button onclick="copyLink()">Copy Link</button>

  <script>
    const params = new URLSearchParams(window.location.search);

    const name = params.get("valentine_name");
    const message = params.get("custom_message");

    const safeName = name || "Hey";
    const safeMessage = message || "Will you be my Valentine?";

    const finalUrl =
      "https://catchmyheart.netlify.app/?" +
      "name=" + encodeURIComponent(safeName) +
      "&msg=" + encodeURIComponent(safeMessage);

    document.getElementById("finalLink").textContent = finalUrl;

    function copyLink() {
      navigator.clipboard.writeText(finalUrl);
      alert("Link copied! 💖");
    }
  </script>

</body>
</html>
